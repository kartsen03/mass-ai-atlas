<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mass AI Atlas · Ask the Atlas</title>
<style>
  /* Matches the Atlas site's dark theme and yellow accent */
  :root{--accent:#facc15;--accent-fg:#111827;--bg:#0b1020;--fg:#e5e7eb;--muted:#9ca3af;--line:rgba(250,204,21,.35)}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #atlas{position:fixed;inset:0;width:100%;height:100%;border:0}

  /* Launcher icon */
  #launcher{position:fixed;right:24px;bottom:24px;z-index:10001;width:64px;height:64px;border-radius:50%;
    border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:grid;place-items:center;
    box-shadow:0 10px 28px rgba(250,204,21,.35),0 2px 6px rgba(0,0,0,.4);transition:transform .15s ease}
  #launcher:hover{transform:scale(1.06)}
  #launcher svg{width:30px;height:30px}
  #launcher .x{display:none}
  body.open #launcher .chat{display:none}
  body.open #launcher .x{display:block}
  #hint{position:fixed;right:100px;bottom:38px;z-index:10001;background:var(--bg);color:var(--fg);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.18);pointer-events:none;transition:opacity .2s}
  body.open #hint,body.seen #hint{opacity:0}

  /* Pop-up chat */
  #popup{position:fixed;right:24px;bottom:104px;z-index:10000;width:420px;height:min(680px,calc(100vh - 128px));
    background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 18px 50px rgba(0,0,0,.30);transform-origin:bottom right;
    transform:scale(.9) translateY(12px);opacity:0;visibility:hidden;transition:transform .18s ease,opacity .18s ease,visibility 0s .18s}
  body.open #popup{transform:none;opacity:1;visibility:visible;transition:transform .18s ease,opacity .18s ease}
  #popup header{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;background:#111827;color:var(--fg);
    border-bottom:2px solid var(--accent)}
  #popup header b{color:var(--accent)}
  #popup header b{font-size:15px;display:block}
  #popup header small{opacity:.85;font-size:12px}
  #popup header .grow{flex:1}
  #close{background:transparent;border:0;color:inherit;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
  #chat{flex:1;width:100%;border:0;background:var(--bg)}
  button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}

  /* After "Show on the map", the Atlas drawer opens on the right, so the chat moves left */
  body.dock-left #popup{right:auto;left:24px;transform-origin:bottom left}
  body.dock-left #launcher{right:auto;left:24px}

  @media (max-width:640px){
    body.dock-left #popup{left:0}
    #popup{right:0;left:0;bottom:0;width:100%;height:100%;border-radius:0;transform-origin:bottom center}
    body.open #launcher{display:none}
    #hint{display:none}
  }
</style>
</head>
<body>
<!-- The Atlas site from this repo, unchanged. Served from the same origin as this page. -->
<script>
  // Skip the Atlas's first-visit tour so it doesn't cover the demo (same origin, same localStorage).
  try { localStorage.setItem("toa-atlas-tour", "done"); } catch (e) {}
</script>
<iframe id="atlas" name="atlas" title="Mass AI Atlas" src="/index.html"></iframe>

<div id="hint" aria-hidden="true">Looking for something? Ask the Atlas</div>

<section id="popup" role="dialog" aria-label="Ask the Atlas chat" aria-hidden="true">
  <header>
    <span aria-hidden="true">🧭</span>
    <span class="grow"><b>Ask the Atlas</b><small>Answers only from the Atlas, with sources</small></span>
    <button id="close" aria-label="Close chat">×</button>
  </header>
  <iframe id="chat" title="Ask the Atlas chatbot"></iframe>
</section>

<button id="launcher" aria-label="Open Ask the Atlas chat" aria-expanded="false" aria-controls="popup">
  <svg class="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/>
  </svg>
  <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
    <path d="M6 6l12 12M18 6L6 18"/>
  </svg>
</button>

<script>
  // The chatbot runs on Streamlit (port 8501 by default). Override with ?chat=http://host:port
  const params = new URLSearchParams(location.search);
  const chatBase = params.get("chat") || `${location.protocol}//${location.hostname}:8501`;
  const site = `${location.origin}/index.html`;
  // Load it right away (hidden) so the first open is instant.
  document.getElementById("chat").src =
    `${chatBase}/?embed=true&embed_options=hide_loading_screen&site=${encodeURIComponent(site)}`;

  const body = document.body, popup = document.getElementById("popup"), launcher = document.getElementById("launcher");
  function setOpen(on){
    body.classList.toggle("open", on);
    body.classList.add("seen");
    popup.setAttribute("aria-hidden", String(!on));
    launcher.setAttribute("aria-expanded", String(on));
    launcher.setAttribute("aria-label", on ? "Close Ask the Atlas chat" : "Open Ask the Atlas chat");
    if (on) document.getElementById("chat").focus(); else launcher.focus();
  }
  launcher.onclick = () => setOpen(!body.classList.contains("open"));
  document.getElementById("close").onclick = () => setOpen(false);
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && body.classList.contains("open")) setOpen(false); });
  if (params.has("open")) setOpen(true);

  // "Show on the map" in the chat: open that entry's drawer in the Atlas behind it.
  const chatOrigin = new URL(chatBase).origin;
  const atlas = document.getElementById("atlas");
  window.addEventListener("message", ev => {
    const chatFrame = document.getElementById("chat").contentWindow;
    let from = ev.source; while (from && from !== chatFrame && from.parent !== from) from = from.parent;
    if (from !== chatFrame && ev.origin !== chatOrigin) return;        // only from our chat panel
    const d = ev.data || {};
    if (d.type !== "atlas-open" || !/^[a-z0-9-]+$/.test(d.id || "")) return;
    const w = atlas.contentWindow;
    try { if (typeof w.openDrawer === "function") w.openDrawer(d.id); else throw 0; }
    catch (e) { atlas.src = `/index.html?entry=${encodeURIComponent(d.id)}`; }
    if (matchMedia("(max-width:640px)").matches) setOpen(false);       // phone: get out of the way
    else document.body.classList.add("dock-left");                     // desktop: uncover the drawer
  });
</script>
</body>
</html>
